<!doctype html>
<html lang="en" id="root"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Abhilekh confirm screen (prototype)</title>
<style>
:root{--ink:#1d2433;--mute:#5d6678;--line:#d9dde6;--bg:#f6f4ef;--card:#fff;--accent:#7a1530;--ok:#1d6b4a}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif}
.wrap{max-width:430px;margin:0 auto;padding:16px 14px 80px}
.banner{background:#fff3cd;border:1px solid #e6d28a;border-radius:8px;padding:8px 10px;font-size:13px;margin-bottom:14px}
h1{font-size:20px;margin:0 0 2px}.sub{color:var(--mute);font-size:14px;margin:0 0 14px}
.prog{font-size:14px;color:var(--mute);margin:0 0 10px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:12px}
.card.done{border-color:var(--ok);background:#f4faf6}
.doc{font-size:12px;color:var(--mute);text-transform:uppercase;letter-spacing:.04em}
.lab{font-size:18px;font-weight:600;margin:2px 0 8px}
.crop{display:block;width:100%;border:1px solid var(--line);border-radius:6px;background:#fff;cursor:zoom-in}
.crop.zoom{position:fixed;inset:0;margin:auto;width:96vw;max-width:900px;height:auto;z-index:10;box-shadow:0 0 0 100vmax rgba(0,0,0,.6);cursor:zoom-out}
.cap{font-size:12px;color:var(--mute);margin:4px 0 10px}
label{display:block;font-size:13px;color:var(--mute);margin-bottom:4px}
input{width:100%;font-size:20px;padding:10px;border:1.5px solid var(--line);border-radius:8px;font-family:inherit}
input:focus{outline:2px solid var(--accent);border-color:var(--accent)}
.row{display:flex;gap:8px;margin-top:10px}
button{font:inherit;font-weight:600;border-radius:8px;padding:11px 14px;border:0;cursor:pointer}
.go{background:var(--accent);color:#fff;flex:1}.go:disabled{background:#c9ced8;cursor:not-allowed}
.undo{background:none;color:var(--accent);padding:6px 4px;font-weight:500}
.val{font-size:20px;font-weight:600}.foot{font-size:13px;color:var(--mute);margin-top:16px}
.lang{display:flex;gap:6px;justify-content:flex-end;margin-bottom:8px}.lg{background:#fff;border:1px solid var(--line);color:var(--ink);padding:5px 12px;font-weight:500;border-radius:16px}.lg.on{background:var(--ink);color:#fff}
.share{width:100%;margin-top:6px;background:var(--ink);color:#fff}.share:disabled{background:#c9ced8}
</style></head><body><div class="wrap">
<div class="lang"><button id="l-en" class="lg">English</button><button id="l-ne" class="lg">नेपाली</button></div>
<div class="banner" id="banner"></div>
<h1 id="h1"></h1>
<p class="sub" id="sub"></p>
<p class="prog" id="prog"></p>
<div id="cards"></div>
<button class="share" id="share" disabled></button>
<p class="foot" id="foot"></p>
</div>

ne:{banner:'<b>SAMPLE · नमूना।</b> काल्पनिक पृष्ठहरूमा बनाइएको प्रोटोटाइप, योजना चरण। हरेक तस्बिर टुक्रा पाठकले भेटेको ठाउँबाट मार्जिनसहित काटिएको हो।',h1:'कागजसँग मिलाएर हेर्नुहोस्',sub:'मिति र दशमलव भएका मानहरू आफैँ भरिँदैनन्। मूल कागज हेर्नुहोस्, अनि एक-एक गरी पुष्टि गर्नुहोस्।',date:'मिति',doc_urine:'पिसाब जाँच प्रतिवेदन',doc_thyroid:'थाइरोइड जाँच प्रतिवेदन',doc_rx:'प्रिस्क्रिप्शन',cap:'तपाईंको तस्बिरबाट। ठूलो हेर्न थिच्नुहोस्।',capRes:'नतिजा, तपाईंको तस्बिरबाट। ठूलो हेर्न थिच्नुहोस्।',capApprox:'नतिजा, तपाईंको तस्बिरबाट। अनुमानित ठाउँ: पाठकले यो मान ठ्याक्कै भेटेन, छेउको लाइन पनि देखिन सक्छ। ठूलो हेर्न थिच्नुहोस्।',capRange:'छापिएको दायरा, तपाईंको तस्बिरबाट।',lblDate:'मितिमा लेखिए जस्तै टाइप गर्नुहोस् (नेपाली वा अंग्रेजी मिति)',lblVal:'पाठकले सारेको मान। कागजसँग फरक भए सच्याउनुहोस्।',okDate:'मिति पुष्टि गर्नुहोस्',ok:'कागजसँग मिल्छ',mine:'मेरो प्रविष्टि प्रयोग गर्नुहोस्',change:'परिवर्तन',share:'मेरो अभिलेखमा थप्नुहोस्',foot:'माथिका सबै वस्तु पुष्टि नभएसम्म तपाईंको अभिलेखमा केही थपिँदैन, र डाक्टरसँग केही साझा गर्न सकिँदैन।',prog:(d,n)=>n+' मध्ये '+d+' पुष्टि भए'}};
let LANG='en';const T=k=>STR[LANG][k];
function setStatic(){document.documentElement.lang=LANG==='ne'?'ne':'en';document.getElementById('banner').innerHTML=T('banner');document.getElementById('h1').textContent=T('h1');document.getElementById('sub').textContent=T('sub');document.getElementById('share').textContent=T('share');document.getElementById('foot').textContent=T('foot');for(const l of['en','ne'])document.getElementById('l-'+l).classList.toggle('on',LANG===l)}
for(const l of['en','ne'])document.getElementById('l-'+l).addEventListener('click',()=>{LANG=l;render()});
const state={};
const el=(t,a={},...k)=>{const e=document.createElement(t);for(const[n,v]of Object.entries(a))n.startsWith('on')?e.addEventListener(n.slice(2),v):e.setAttribute(n,v);k.forEach(x=>e.append(x));return e};
function render(){
  setStatic();
  const box=document.getElementById('cards');box.replaceChildren();
  let done=0;
  for(const c of CARDS){
    const s=state[c.id]??(state[c.id]={confirmed:false,text:c.reading});
    if(s.confirmed)done++;
    const card=el('div',{class:'card'+(s.confirmed?' done':'')});
    card.append(el('div',{class:'doc'},T('doc_'+c.doc)),el('div',{class:'lab'},c.kind==='date'?T('date'):c.label));
    const img=el('img',{class:'crop',src:c.img,alt:'Cropped from the original page: '+c.label});
    img.addEventListener('click',()=>img.classList.toggle('zoom'));card.append(img);
    card.append(el('div',{class:'cap'},c.img2?(c.approx?T('capApprox'):T('capRes')):T('cap')));
    if(c.img2){const i2=el('img',{class:'crop',src:c.img2,alt:'Printed range, cropped from the original page: '+c.label});i2.addEventListener('click',()=>i2.classList.toggle('zoom'));card.append(i2,el('div',{class:'cap'},T('capRange')));}
    if(s.confirmed){
      card.append(el('div',{class:'val'},'✓ '+s.text),el('div',{class:'row'},el('button',{class:'undo',onclick:()=>{s.confirmed=false;render()}},T('change'))));
    }else{
      const id='in-'+c.id;
      card.append(el('label',{for:id},c.kind==='date'?T('lblDate'):T('lblVal')));
      const inp=el('input',{id,type:'text',inputmode:c.kind==='date'?'text':'decimal',autocomplete:'off',value:s.text});
      const btn=el('button',{class:'go'},c.kind==='date'?T('okDate'):T('ok'));
      const sync=()=>{s.text=inp.value.trim();btn.disabled=!s.text;btn.textContent=c.kind==='date'?T('okDate'):(s.text===c.reading?T('ok'):T('mine'))};
      inp.addEventListener('input',sync);btn.addEventListener('click',()=>{if(s.text){s.confirmed=true;render()}});
      card.append(inp,el('div',{class:'row'},btn));sync();
    }
    box.append(card);
  }
  document.getElementById('prog').textContent=T('prog')(done,CARDS.length);
  document.getElementById('share').disabled=done<CARDS.length;
}
render();
</script></body></html>
