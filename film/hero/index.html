:root{--ground:#0b0d12;--paper:#efe7d6;--ink:#1d2433;--accent:#c33a4f;--gold:#d8a656}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1920px;height:1080px;overflow:hidden;background:var(--ground)}
#root{width:100%;height:100%;position:relative;overflow:hidden}
#ground{position:absolute;inset:0;background:radial-gradient(ellipse 60% 55% at 50% 52%,#1b2030 0%,#10131b 55%,#07080c 100%)}
#stage{position:absolute;inset:0}
#bag{position:absolute;left:660px;top:330px;width:600px;height:640px}

.sheet{position:absolute;left:830px;top:520px;width:260px;height:340px;background:var(--paper);border-radius:10px;padding:26px 24px;z-index:2;box-shadow:0 30px 60px rgba(0,0,0,.45);overflow:hidden}
.sheet .hd{height:16px;width:58%;background:#7a1530;border-radius:4px;margin-bottom:22px;opacity:.9}
.sheet .ln{display:block;height:11px;background:#b9b0a0;border-radius:5px;margin:0 0 17px}
.sheet .stamp{position:absolute;right:16px;bottom:14px;width:58px;height:26px;border:2.5px solid #a2463f;border-radius:6px;opacity:.75;transform:rotate(-8deg)}
.sheet .scan{position:absolute;left:0;right:0;top:-40px;height:40px;background:linear-gradient(180deg,rgba(216,166,86,0),rgba(216,166,86,.55),rgba(216,166,86,0));opacity:0}
.sheet .tick{position:absolute;right:-18px;top:-18px;width:64px;height:64px;border-radius:50%;background:#1d6b4a;box-shadow:0 10px 30px rgba(29,107,74,.6);opacity:0}
.sheet .tick svg{width:100%;height:100%}
.sheet .tick path{fill:none;stroke:#fff;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
#phone{position:absolute;left:780px;top:150px;width:360px;height:740px;border-radius:56px;background:#14161c;border:3px solid #2c303b;box-shadow:0 60px 120px rgba(0,0,0,.6),0 0 0 1px rgba(255,255,255,.04) inset;z-index:4}
#screen{position:absolute;left:18px;top:18px;right:18px;bottom:18px;border-radius:40px;background:var(--paper);overflow:hidden}
#notch{position:absolute;left:50%;top:14px;width:96px;height:24px;margin-left:-48px;border-radius:12px;background:#14161c}
#qrbox{position:absolute;left:40px;top:220px;width:244px;height:244px;opacity:0}
#qr{width:244px;height:244px;display:grid;grid-template-columns:repeat(25,1fr);grid-template-rows:repeat(25,1fr)}
#qr i{background:#1d2433;display:block}
#qrscan{position:absolute;left:-10px;right:-10px;height:30px;top:0;background:linear-gradient(180deg,rgba(195,58,79,0),rgba(195,58,79,.5),rgba(195,58,79,0))}

#ph-sub{position:absolute;left:40px;top:130px;width:210px;height:11px;background:#b9b0a0;border-radius:5px;opacity:0}
#ph-pill{position:absolute;left:40px;bottom:96px;width:244px;height:54px;border-radius:27px;background:#7a1530;opacity:0}
#flood{position:absolute;inset:0;background:#07080c;opacity:0;z-index:9}

<script>
const tl = gsap.timeline({ paused: true });
const S = [0,1,2,3,4].map(i => '#s'+i);
// start states
gsap.set('#stage', { scale: 1.06, transformOrigin: '50% 55%' });
gsap.set(['#bag','#bagfront'], { opacity: 0, filter: 'blur(10px)' });
const inBag = [[-70,150,-9],[ -20,170,6],[30,160,-4],[70,175,10],[0,190,-2]];
S.forEach((s,i) => gsap.set(s, { x: inBag[i][0], y: inBag[i][1], rotation: inBag[i][2], scale: .9 }));
gsap.set('#phone', { y: 900, opacity: 0 });
gsap.set('#flood', { opacity: 1 });
// 0 - 1.4: out of darkness, the bag arrives
tl.to('#flood', { opacity: 0, duration: 1.2, ease: 'power2.inOut' }, 0);
tl.to(['#bag','#bagfront'], { opacity: 1, filter: 'blur(0px)', duration: 1.3, ease: 'expo.out' }, 0.2);
tl.to('#stage', { scale: 1, duration: 4.6, ease: 'power2.inOut' }, 0);
// 1.2 - 3.6: the papers rise out of the bag, one after another
const up = [[-330,-250,-14],[-150,-300,9],[30,-330,-5],[200,-290,12],[360,-235,-8]];
S.forEach((s,i) => tl.to(s, { x: up[i][0], y: up[i][1], rotation: up[i][2], scale: 1, duration: 1.25, ease: 'expo.out' }, 1.2 + i*0.26));
// 3.4 - 4.3: the bag sinks away
tl.to(['#bag','#bagfront'], { y: 140, opacity: 0, filter: 'blur(12px)', duration: .85, ease: 'power3.in' }, 3.45);
// 3.9 - 5.2: the papers straighten into one row
S.forEach((s,i) => tl.to(s, { x: (i-2)*310, y: -30, rotation: 0, duration: 1.2, ease: 'power3.inOut' }, 3.9 + i*0.05));
// 5.3 - 7.4: each is read (a light passes) and checked
S.forEach((s,i) => {
  const t0 = 5.35 + i*0.34;
  tl.fromTo('#scan'+i, { y: 0, opacity: 0 }, { y: 380, opacity: 1, duration: .55, ease: 'power2.inOut' }, t0);
  tl.to('#scan'+i, { opacity: 0, duration: .15, ease: 'power1.out' }, t0 + .5);
